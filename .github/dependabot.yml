version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      include: scope
    # typescript-eslint@8.72.0 requires TypeScript >=4.8.4 <6.1.0 and explicitly rejects TypeScript 7.
    # Revisit the TypeScript pin/ignore when upstream supports newer compilers.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      npm-development-dependencies:
        dependency-type: development
        patterns:
          - "*"
      npm-production-dependencies:
        dependency-type: production
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
